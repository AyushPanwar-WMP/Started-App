name: Node-Workflow-Validation

on:
  push:
    branches: ["*"]
  workflow_dispatch:

env:
  WORKFLOW_ENV: workflow-value

jobs:
   build:
        name: build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20,22,24]
        steps:

            - name: checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with: 
               node-version: "${{matrix.node-version}}"
               cache: npm

            - name: dependencies install
              run: npm ci
#generate the artifacts
            - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               scan-type: 'fs'
               format: 'github'
               output: 'dependency-results.sbom.json'
               scan-ref: '.'
               github-pat: ${{ secrets.GITHUB_TOKEN }} 
 #upload artifact
            - name: upload SBOM artifact to github
              uses: actions/upload-artifact@v4
              with:
                name: custom-warrehous
                path: "dependency-results.sbom.json"
                retention-days: 14 

   test:
        name: test
        runs-on: ubuntu-latest
        needs: build
        steps:

            - name: checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with: 
               node-version: "24"
               cache: npm

            - name: dependencies install
              run: npm ci

            - name: testing
              run: npm test


    #Security scan for known vulnerabilities
   security-scan:
        name: Security scan
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: scan vulnaribilites
              run: npm audit

    #static code analysis
            - name: static application security testing using semgrep
              uses: semgrep/semgrep-action@v1
              with:
               config: p/javascript

#deploy
   deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: Production
    needs: 
       - test 
       - security-scan

    steps:
        - name: download SBOM artifact
          uses: actions/download-artifact@v4
          with:
            name: custom-warrehous
            path: deployment-artifact

        - name: deploy artifact
          run: |
            mkdir -p deployed
            cp deployment-artifact/dependency-results.sbom.json deployed/
            echo "Deployment complete: SBOM artifact copied to deployed/"

        - name: verify deployment token
          env:
            DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          run: |
            "${DEPLOY_TOKEN:?DEPLOY_TOKEN is not configured}"
            echo "Deployment token is available"