name: Node-Workflow-Validation

on:
  push:
    branches: ["*"]
  workflow_dispatch:

env:
  WORKFLOW_ENV: workflow-value

jobs:
   build:
        name: build
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20,22,24]
        steps:

            - name: checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with: 
               node-version: "${{matrix.node-version}}"
               cache: npm

            - name: dependencies install
              run: npm ci

   test:
        name: test
        runs-on: ubuntu-latest
        needs: build
        steps:

            - name: checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with: 
               node-version: "24"
               cache: npm

            - name: dependencies install
              run: npm ci

            - name: testing
              run: npm test
              
    #Security scan for known vulnerabilities
   security-scan:
        name: Security scan
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: scan vulnaribilites
              run: npm audit

    #static code analysis
            - name: static application security testing using semgrep
              uses: semgrep/semgrep-action@v1
              with:
               config: p/javascript
